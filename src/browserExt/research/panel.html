<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add &amp; Summarize</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header><div><span class="eyebrow">ZOTERO RESEARCH</span><h1 id="title" hidden></h1></div><button id="close" class="icon" aria-label="Close">×</button></header>
<main>
  <section id="actions"><button id="entry">Add entry &amp; Summarize</button><button id="pdf" class="secondary">Add PDF &amp; Summarize</button><button id="ordinary" class="secondary">Save with usual workflow</button></section>
  <section id="paperChoice" hidden><h2>Which paper?</h2><p>The thread links to more than one paper.</p><div id="paperChoices"></div></section>
  <div id="progress" role="status" aria-live="polite"><span id="activity" aria-hidden="true"></span><div><p id="status">Connecting to Zotero…</p><p id="elapsed" aria-live="off" hidden></p></div></div>
  <p id="notice" class="hint" role="status" hidden></p><p id="error" role="alert" hidden></p><button id="retry" class="secondary" hidden>Retry ingestion</button>
  <section id="categories" hidden aria-labelledby="categoriesHeading">
    <div class="section-heading"><h2 id="categoriesHeading">Categories</h2><span id="categoryStatus" role="status"></span></div>
    <div id="categoryChips"></div>
    <details id="categoryPicker"><summary>Edit categories <span aria-hidden="true">⌄</span></summary>
      <div class="category-menu"><input id="categorySearch" type="search" placeholder="Find a category…" aria-label="Find a category" autocomplete="off"><div id="categoryOptions"></div><p id="noCategories" class="hint" hidden>No matching categories</p></div>
    </details>
  </section>
  <section id="approval" hidden><h2>Suggested new categories</h2><p>Choose any to create. Existing categories have already been applied.</p><div id="proposals"></div><div class="approval-actions"><button id="approve">Save choices</button><button id="skip" class="secondary">Skip new categories</button></div></section>
  <section id="paper" hidden><h2>Summary</h2><p id="summary"></p><button id="produceSummary" hidden>Produce summary</button><p id="coverage" class="hint" hidden></p></section>
  <section id="chat" hidden><h2>Discussion</h2><div id="messages" aria-live="polite"></div><div id="partial" class="markdown"></div><form id="chatForm"><textarea id="question" aria-label="Ask about the paper" rows="2" placeholder="What is the key insight behind the method?"></textarea><button id="send" type="submit">Send</button></form></section>
</main>
<footer id="footer" hidden><details id="session" hidden><summary>Codex session</summary><div class="session-command"><code id="sessionCommand"></code><button id="copySession" class="secondary">Copy command</button></div><span id="copyStatus" class="hint" role="status"></span></details></footer>
<script src="../browser-polyfill.js"></script><script src="../lib/marked.js"></script><script src="../lib/dompurify.js"></script><script src="panel.js"></script>
</body></html>
